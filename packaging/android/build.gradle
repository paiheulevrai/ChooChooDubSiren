plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paiheulevrai.choochoodubsiren'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.paiheulevrai.choochoodubsiren'
        minSdk 26
        targetSdk 34
        versionCode 200
        versionName '0.2.0-android-preview'
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-26'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
}
